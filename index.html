<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Night Drive</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;font-family:"Courier New",monospace;}
  #c{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen;opacity:.115;}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.72) 100%);}
  #scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.165) 0 1px,transparent 1px 3px);}
  #ui{position:fixed;left:12px;top:10px;color:#cfc5b0;font-size:12px;letter-spacing:2px;text-shadow:0 0 4px #000;pointer-events:none;}
  #hint{position:fixed;left:0;right:0;bottom:16px;text-align:center;color:#a39a88;font-size:11px;letter-spacing:1px;pointer-events:none;text-shadow:0 0 4px #000;transition:opacity .4s;}
  #thought{position:fixed;left:0;right:0;bottom:22%;text-align:center;color:#d8cfbd;font:italic 17px Georgia,'Times New Roman',serif;letter-spacing:.5px;pointer-events:none;opacity:0;transition:opacity 1.1s;text-shadow:0 0 8px #000,0 0 2px #000;padding:0 24px;}
  #stick{position:fixed;left:26px;bottom:26px;width:110px;height:110px;border-radius:50%;border:1px solid rgba(207,197,176,.35);background:rgba(0,0,0,.25);display:none;pointer-events:none;}
  #nub{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(207,197,176,.5);}
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .7s;z-index:5;}
  #dlg{position:fixed;left:0;right:0;bottom:0;padding:18px 20px 26px;background:linear-gradient(transparent, rgba(0,0,0,.85) 30%);display:none;z-index:6;font-family:Georgia,'Times New Roman',serif;}
  #dlgName{color:#8f887a;font:11px 'Courier New',monospace;letter-spacing:2px;margin-bottom:6px;}
  #dlgText{color:#e6dcc8;font-size:17px;line-height:1.45;min-height:50px;text-shadow:0 0 6px #000;max-width:720px;margin:0 auto 14px;}
  #dlgOpts{display:flex;flex-direction:column;gap:8px;max-width:720px;margin:0 auto;}
  #dlgOpts button{background:rgba(20,18,16,.8);color:#cfc5b0;border:1px solid #4a4440;border-radius:3px;padding:10px 14px;text-align:left;font:15px Georgia,serif;letter-spacing:.3px;}
  #dlgOpts button:active{background:#2a2622;}
  #center{position:fixed;right:10px;top:8px;background:rgba(0,0,0,.45);color:#cfc5b0;border:1px solid #4a4440;font:11px "Courier New";padding:6px 10px;border-radius:3px;letter-spacing:1px;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx" width="160" height="90"></canvas>
<div id="vig"></div><div id="scan"></div>
<div id="ui">NIGHT DRIVE<br><span id="clk" style="font-size:10px;color:#8f887a"></span></div>
<div id="hint">drag to look around &middot; tap things in the car</div>
<div id="thought"></div>
<div id="stick"><div id="nub"></div></div>
<div id="fade"></div>
<div id="dlg"><div id="dlgName">ATTENDANT</div><div id="dlgText"></div><div id="dlgOpts"></div></div>
<button id="center">recenter</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ───────────────────────── SETUP ─────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:false});
renderer.setPixelRatio(1);
const PX = 0.42; // internal resolution scale (lower = chunkier PS1 look)

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1120);
scene.fog = new THREE.FogExp2(0x0b1120, 0.055);

const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 1500);
camera.rotation.order = 'YXZ';
camera.layers.enable(1);
camera.position.set(-0.56, 1.34, 0.18);
scene.add(camera);

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(Math.floor(w*PX), Math.floor(h*PX), false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

// ───────────────────────── THE ROAD (curves) ─────────────────────────
// Everything in the world is placed relative to distance travelled "t".
// C(d) is how far the road has drifted sideways at distance d.
const L = 2100;            // loop length
let t = 0;                 // distance travelled
const SPEED = 16;          // units per second
const LANE = -1.55;        // the road sits this far left of the car, so we drive in the right-hand lane
const PEANUT_TIME = 20;    // seconds of driving before the boiled-peanut stand (set to ~120 for the real game)
const PEANUT_D = SPEED*PEANUT_TIME + 70;                 // where the car stops for the stand
const PEANUT_X = 5.6;      // road-x where the car parks at the stand
const STOP_TIME = 20;      // seconds of driving from the stand to the gas station (set to 180 for the real game)
const STOP_D = PEANUT_D + SPEED*STOP_TIME + 70;          // where the car comes to rest at the station
const PUMP_X = 8.5;        // road-x where the car parks (pump island is at 12, on the passenger side, leaving room to walk between)
let lane = LANE, speed = SPEED, mode = 'drive';  // mode: 'drive' | 'parked' | 'walk'
let stopAt = PEANUT_D, stopKind = 'peanut';       // where the car next has to stop, and why
const DEER_TIME = 20;      // seconds after leaving the station until the deer (set to 90 for the real game)
const DEER_D = STOP_D + SPEED*DEER_TIME + 70;            // where the deer lies
const MOTEL_TIME = 20;     // seconds from the deer to the motel (set to ~120 for the real game)
const MOTEL_D = DEER_D + SPEED*MOTEL_TIME + 70;          // where the car stops at the motel
const MOTEL_X = 8;         // road-x where the car parks in the motel lot
function inMotelZone(d){ return d > MOTEL_D - 26 && d < MOTEL_D + 30; }
function inStopZone(d, x){ return (x > 0 && x < 38 && d > STOP_D - 46 && d < STOP_D + 24) || (x > 0 && x < 17 && d > PEANUT_D - 40 && d < PEANUT_D + 16) || (x > 0 && x < 32 && inMotelZone(d)); }   // clearings for the station, the stand and the motel
function C(d){ return 45*Math.sin(d*0.0035) + 20*Math.sin(d*0.009+2); }
function Cp(d){ return 45*0.0035*Math.cos(d*0.0035) + 20*0.009*Math.cos(d*0.009+2); }

const things = []; // {obj, d, x, follow}
function addThing(obj, d, x, follow){ obj.layers.set(1); obj.traverse(o=>o.layers.set(1)); scene.add(obj); things.push({obj, d, x, follow:!!follow}); }
function relOf(d){ let r = ((d - t) % L + L) % L; if (r > L-60) r -= L; return r; }
function place(th){
  const r = relOf(th.d);
  const dx = C(t+r) - C(t) - r*Cp(t);
  th.obj.position.z = -r;
  th.obj.position.x = th.x + dx + lane;
  if (th.follow) th.obj.rotation.y = -Math.atan(Cp(t+r) - Cp(t)) + (th.obj.userData.yaw || 0);
  if (leg >= 3 && th.obj.visible && th.obj.userData.civ && r > 20) th.obj.visible = false;   // anything man-made that comes round the loop again stays gone
}

// ───────────────────────── MATERIALS / TEXTURES ─────────────────────────
function pixelTex(c){ const tx = new THREE.CanvasTexture(c); tx.magFilter = tx.minFilter = THREE.NearestFilter; return tx; }

function roadTex(){
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  g.fillStyle = '#1b1b1f'; g.fillRect(0,0,64,64);
  for (let i=0;i<400;i++){ g.fillStyle = Math.random()<.5 ? '#222227' : '#161619'; g.fillRect(Math.random()*64|0, Math.random()*64|0, 1, 1); }
  g.fillStyle = '#9a958a'; g.fillRect(3,0,2,64); g.fillRect(59,0,2,64);
  g.fillStyle = '#c9a63a'; g.fillRect(29,20,2,24); g.fillRect(33,20,2,24);
  return pixelTex(c);
}
function signTex(){
  const c = document.createElement('canvas'); c.width = 64; c.height = 80; const g = c.getContext('2d');
  g.fillStyle = '#e8e4d8'; g.fillRect(0,0,64,80); g.strokeStyle = '#111'; g.lineWidth = 3; g.strokeRect(3,3,58,74);
  g.fillStyle = '#111'; g.textAlign = 'center'; g.font = 'bold 11px sans-serif';
  g.fillText('SPEED',32,20); g.fillText('LIMIT',32,33); g.font = 'bold 30px sans-serif'; g.fillText('40',32,66);
  return pixelTex(c);
}
function dialTex(max, label){
  const c = document.createElement('canvas'); c.width = c.height = 96; const g = c.getContext('2d');
  g.fillStyle = '#0a0a0c'; g.beginPath(); g.arc(48,48,46,0,7); g.fill();
  g.strokeStyle = '#d8d2c0'; g.lineWidth = 2; g.fillStyle = '#d8d2c0'; g.textAlign = 'center'; g.font = '9px monospace';
  for (let i=0;i<=10;i++){
    const a = Math.PI*0.75 + i*(Math.PI*1.5/10); const r1 = (i%5==0) ? 36 : 40;
    g.beginPath(); g.moveTo(48+Math.cos(a)*r1, 48+Math.sin(a)*r1); g.lineTo(48+Math.cos(a)*44, 48+Math.sin(a)*44); g.stroke();
    if (i%2==0) g.fillText(String(max*i/10), 48+Math.cos(a)*27, 48+Math.sin(a)*27+3);
  }
  g.fillStyle = '#8f887a'; g.font = '8px monospace'; g.fillText(label, 48, 74);
  return pixelTex(c);
}
const clockCanvas = document.createElement('canvas'); clockCanvas.width = 128; clockCanvas.height = 32;
const clockTexture = pixelTex(clockCanvas);
let stereoOn = true, station = 0;
// ───────── RADIO STATIONS ─────────
// type 'static' plays synthesized hiss. type 'audio' plays a file: {label:'FM 101.3', type:'audio', src:'song.mp3'}
const STATIONS = [
  {label:'FM 88.7', type:'static'},
  {label:'FM 94.1', type:'static', tone: 0.5},   // a fainter, differently-pitched static
  {label:'AM 1460', type:'static', tone: -0.6},
];
function drawClock(timeStr){
  const g = clockCanvas.getContext('2d');
  g.fillStyle = '#05080a'; g.fillRect(0,0,128,32);
  g.fillStyle = '#7fe28a'; g.font = 'bold 14px monospace'; g.textAlign = 'left';
  g.fillText(stereoOn ? STATIONS[station].label : '--  --', 6, 21);
  g.textAlign = 'right'; g.fillText(timeStr, 122, 21);
  clockTexture.needsUpdate = true;
}

const M = {
  road:  new THREE.MeshLambertMaterial({map: roadTex()}),
  ground:new THREE.MeshLambertMaterial({color:0x0e140c}),
  tree:  new THREE.MeshLambertMaterial({color:0x14301a, flatShading:true}),
  trunk: new THREE.MeshLambertMaterial({color:0x2d2219}),
  pole:  new THREE.MeshLambertMaterial({color:0x3b2f25}),
  rail:  new THREE.MeshLambertMaterial({color:0x8a8a84}),
  house: new THREE.MeshLambertMaterial({color:0xcbc3b4}),
  roof:  new THREE.MeshLambertMaterial({color:0x4a4038}),
  window:new THREE.MeshBasicMaterial({color:0xffcf7a}),
  dash:  new THREE.MeshLambertMaterial({color:0x2a2623}),
  vinyl: new THREE.MeshLambertMaterial({color:0x3a312a}),
  dark:  new THREE.MeshLambertMaterial({color:0x171513}),
  chrome:new THREE.MeshLambertMaterial({color:0x8d8a84}),
  needle:new THREE.MeshBasicMaterial({color:0xff4b3a}),
};

// ───────────────────────── SKY ─────────────────────────
// sky: two colours blended by height; they drift from last-light blue to full night after the first stop
const NIGHT_TOP = new THREE.Color(0.015, 0.015, 0.05), NIGHT_HOR = new THREE.Color(0.027, 0.023, 0.047), NIGHT_FOG = new THREE.Color(0x07060c);
const DUSK_TOP = new THREE.Color(0.02, 0.05, 0.17), DUSK_HOR = new THREE.Color(0.10, 0.15, 0.30), DUSK_FOG = new THREE.Color(0x0b1120);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite:false, fog:false,
  uniforms: { top: {value: DUSK_TOP.clone()}, hor: {value: DUSK_HOR.clone()} },
  vertexShader: 'varying float vy; void main(){ vy = position.y; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 hor; varying float vy; void main(){ float h = clamp((vy-120.0)/300.0, 0.0, 1.0); gl_FragColor = vec4(mix(hor, top, pow(h, 0.55)), 1.0); }'
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 16, 10), skyMat);
let dusk = 1;   // 1 = the last blue of the evening, 0 = full dark
sky.layers.enable(1); scene.add(sky);

const starGeo = new THREE.BufferGeometry(); const sp = [];
for (let i=0;i<500;i++){ const a = Math.random()*Math.PI*2, e = 0.35 + Math.random()*1.1, r = 800; sp.push(Math.cos(a)*Math.cos(e)*r, Math.sin(e)*r, Math.sin(a)*Math.cos(e)*r); }
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xcfd2e6, size:2.2, sizeAttenuation:false, fog:false, transparent:true, opacity:0.25}));
stars.layers.enable(1); scene.add(stars);

const moon = new THREE.Mesh(new THREE.SphereGeometry(16, 10, 8), new THREE.MeshBasicMaterial({color:0xe9e4d0, fog:false}));
moon.position.set(-260, 150, -650); moon.layers.enable(1); scene.add(moon);

// ───────────────────────── LIGHTS ─────────────────────────
function L1(l){ l.layers.enable(1); return l; }
const hemi = L1(new THREE.HemisphereLight(0x1a1830, 0x030303, 0.3)); scene.add(hemi);
scene.add(L1(new THREE.AmbientLight(0x1a1a20, 0.6)));   // faint fill: unlit faces read as very dark grey, not holes
const moonLight = L1(new THREE.DirectionalLight(0x8e94c8, 0.14)); moonLight.position.set(-1, 2, -2); scene.add(moonLight);
function headlight(x){
  const s = L1(new THREE.SpotLight(0xffe9b8, 2.8, 70, 0.55, 0.7, 1));
  s.position.set(x, 0.66, -2.3); s.target.position.set(x*1.2, -0.3, -40);
  scene.add(s); scene.add(s.target); return s;
}
const headL = headlight(-0.75), headR = headlight(0.75);
const HEAD_I = 2.8;        // normal headlight intensity
const dashGlow = new THREE.PointLight(0xff9a4a, 0.55, 3.2); dashGlow.position.set(-0.1, 0.95, -0.95); scene.add(dashGlow);

// ───────────────────────── WORLD OBJECTS ─────────────────────────
function lumpy(geo, amt){
  const p = geo.attributes.position;
  for (let i=0;i<p.count;i++){ p.setXYZ(i, p.getX(i)+(Math.random()-0.5)*amt, p.getY(i)+(Math.random()-0.5)*amt, p.getZ(i)+(Math.random()-0.5)*amt); }
  return geo;
}
function merge(parts){
  const pos = [], uv = [];
  for (const c of parts){ const n = c.toNonIndexed(); pos.push(...n.attributes.position.array); uv.push(...n.attributes.uv.array); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.computeVertexNormals(); return g;
}
function tilted(geo, x, y, z, rx, rz){ geo.rotateX(rx); geo.rotateZ(rz); geo.translate(x, y, z); return geo; }
const dummy = new THREE.Object3D();

const ground = new THREE.Mesh(new THREE.PlaneGeometry(2400, 2400), M.ground);
ground.rotation.x = -Math.PI/2; ground.position.y = -0.02; ground.layers.enable(1); scene.add(ground);

// road segments
const roadGeo = new THREE.PlaneGeometry(6.4, 10.6); roadGeo.rotateX(-Math.PI/2);
for (let d=0; d<L; d+=10){ addThing(new THREE.Mesh(roadGeo, M.road), d, 0, true); }

// solid forest mass behind the trees — a continuous dark wall so no gap ever shows sky
const wallMat = new THREE.MeshLambertMaterial({color:0x0a0d0a, flatShading:true});
const wallGeo = lumpy(new THREE.BoxGeometry(14, 16, 20.5, 2, 3, 4), 1.6); wallGeo.translate(0, 7.5, 0);
function inPeanutZone(d){ return d > PEANUT_D - 40 && d < PEANUT_D + 16; }
function inStationZone(d){ return d > STOP_D - 46 && d < STOP_D + 24; }
// how far each wall steps back from the road at a given distance: eased in and out over a long run, so the step never shows as a flat end-face
function ramp(d, inFn, w){ if (inFn(d)) return 1; let best = 0; for (let s = -w; s <= w; s += 4){ if (inFn(d + s)) best = Math.max(best, 1 - Math.abs(s)/w); } const k = best; return k*k*(3 - 2*k); }
function nearWallX(d){ return 20 + 6*ramp(d, inPeanutZone, 50) + 20*ramp(d, inMotelZone, 70) + 22*ramp(d, inStationZone, 70); }   // right-hand side only; the left wall never moves
function farWallX(d){ return 32 + 6*ramp(d, inPeanutZone, 50) + 20*ramp(d, inMotelZone, 70) + 16*ramp(d, inStationZone, 70); }
// each slab is laid along the chord between its x at d and at d+20, so consecutive slabs form one continuous angled wall
function wallSlab(geo, d, xFn, side){
  const x1 = side > 0 ? xFn(d) : xFn(-1e9), x2 = side > 0 ? xFn(d + 20) : xFn(-1e9), xx = side*(x1 + x2)/2, dx = side*(x2 - x1);
  const m = new THREE.Mesh(geo, wallMat); m.userData.yaw = -Math.atan2(dx, 20); m.scale.z = Math.sqrt(dx*dx + 400)/20;
  addThing(m, d + 10, xx, true);
}
for (let d=0; d<L; d+=20) for (const side of [-1, 1]) wallSlab(wallGeo, d, nearWallX, side);
const wallGeo2 = lumpy(new THREE.BoxGeometry(16, 22, 20.5, 2, 3, 4), 2.0); wallGeo2.translate(0, 10, 0);
for (let d=0; d<L; d+=20) for (const side of [-1, 1]) wallSlab(wallGeo2, d, farWallX, side);

// telephone poles (with crossarm and a sagging wire stub)
const poleGeo = new THREE.CylinderGeometry(0.12, 0.17, 9.5, 5), barGeo = new THREE.BoxGeometry(1.7, 0.12, 0.12);
for (let d=20; d<L; d+=34){
  const g = new THREE.Group();
  const p = new THREE.Mesh(poleGeo, M.pole); p.position.y = 4.75; g.add(p);
  const b = new THREE.Mesh(barGeo, M.pole); b.position.y = 8.9; g.add(b);
  for (const x of [-0.6, 0.6]){ const ins = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.18, 5), M.chrome); ins.position.set(x, 9.05, 0); g.add(ins); }
  if (!inStopZone(d, 4.4)){ addThing(g, d, 4.4); g.userData.civ = 'pole'; g.userData.idx = Math.round(d/34); }
}

// early-road clutter — mailboxes, bikes, scrap, a dead car: the last traces of people, gone after the first stop
const blackM = new THREE.MeshLambertMaterial({color:0x151416});
const rust = new THREE.MeshLambertMaterial({color:0x4a3324, flatShading:true}), rust2 = new THREE.MeshLambertMaterial({color:0x5e4a3a, flatShading:true}), galv = new THREE.MeshLambertMaterial({color:0x5a5e60});
function early(g, d, x){ if (inStopZone(d, x)) return; addThing(g, d, x); g.userData.civ = 'early'; }
for (let d=60; d<PEANUT_D-40; d+=37 + (Math.random()*50|0)){            // mailboxes on posts, some leaning, some with the flag up
  const g = new THREE.Group(); const post = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.1, 0.1), M.pole); post.position.y = 0.55; g.add(post);
  const bx = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.25, 0.22), Math.random()<0.5 ? galv : rust2); bx.position.set(0, 1.2, 0); g.add(bx);
  const top = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.5, 8, 1, false, 0, Math.PI), galv); top.rotation.z = Math.PI/2; top.position.set(0, 1.32, 0); g.add(top);
  if (Math.random()<0.4){ const flag = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.12, 0.05), new THREE.MeshLambertMaterial({color:0x8a2a2a})); flag.position.set(0.27, 1.36, 0); g.add(flag); }
  g.rotation.z = (Math.random()-0.5)*0.25; g.rotation.y = (Math.random()-0.5)*0.6;
  early(g, d, (Math.random()<0.7 ? 1 : -1)*(3.9 + Math.random()*0.5));
}
function bike(){ // a bicycle on its side in the ditch
  const g = new THREE.Group(); const wheelG = new THREE.TorusGeometry(0.33, 0.02, 5, 12);
  for (const z of [-0.5, 0.5]){ const w = new THREE.Mesh(wheelG, rust); w.position.set(0, 0.05, z); w.rotation.x = Math.PI/2; g.add(w); for (let i=0;i<6;i++){ const sp = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.008, 0.008), galv); sp.position.set(0, 0.05, z); sp.rotation.y = i*Math.PI/6; g.add(sp); } }
  for (const [x,y,z,rx,rz,l] of [[0,0.05,-0.1,0.3,0,0.7],[0,0.05,0.2,-0.9,0,0.6],[0,0.05,0.05,0,0,0.9]]){ const t = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, l, 5), rust2); t.position.set(x, y, z); t.rotation.set(rx, 0, Math.PI/2 + rz); g.add(t); }
  const bars = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.5, 5), galv); bars.position.set(0.25, 0.05, -0.5); bars.rotation.z = Math.PI/2; bars.rotation.y = 0.4; g.add(bars);
  const seat = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.05, 0.12), blackM); seat.position.set(0.3, 0.05, 0.25); g.add(seat);
  return g;
}
for (const d of [95, 210, 290]) { const g = bike(); g.rotation.y = Math.random()*6.28; early(g, d, (Math.random()<0.5?1:-1)*(4.6 + Math.random()*1.2)); }
function scrap(){ // a heap of sheet metal, a drum, a wheel rim
  const g = new THREE.Group();

function drawPumpDisplay(c, tex, gallons, sale){ // mechanical number wheels; the last wheel rolls continuously
  const g = c.getContext('2d');
  g.fillStyle = '#1a1a1c'; g.fillRect(0,0,96,64);
  g.fillStyle = '#d8d2c0'; g.font = 'bold 7px sans-serif'; g.textAlign = 'left'; g.fillText('THIS SALE $', 5, 10); g.fillText('GALLONS', 5, 36);
  const wheels = (y, value, digits, decimals) => {
    const str = value.toFixed(decimals).replace('.', '').padStart(digits, '0');
    for (let i=0;i<digits;i++){
      const x = 8 + i*14; g.fillStyle = '#efe9d8'; g.fillRect(x, y, 11, 16);
      const roll = (i === digits-1) ? (value*Math.pow(10, decimals)) % 1 : 0;
      g.save(); g.beginPath(); g.rect(x, y, 11, 16); g.clip(); g.fillStyle = '#111'; g.font = 'bold 12px monospace'; g.textAlign = 'center';
      g.fillText(str[i], x+5.5, y+13 + roll*16); g.fillText(String((+str[i]+1)%10), x+5.5, y+13 + roll*16 - 16); g.restore();
      g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(x, y, 11, 3); g.fillRect(x, y+13, 11, 3);
      if (i === digits-1-decimals){ g.fillStyle = '#fff'; g.fillRect(x+12, y+12, 2, 2); }
    }
  };
  wheels(13, sale, 5, 2); wheels(39, gallons, 5, 1);
  g.fillStyle = '#8a2a2a'; g.font = 'bold 6px sans-serif'; g.textAlign = 'right'; g.fillText('REGULAR  UNLEADED', 92, 62);
  g.fillStyle = '#d8d2c0'; g.font = '6px sans-serif'; g.textAlign = 'left'; g.fillText('PRICE PER GAL  1.09', 5, 62);
  tex.needsUpdate = true;
}

// fur: mottled tan-brown with a darker dorsal band; lathe-built body parts so the silhouette is continuous, not stacked blobs
function furTex(base, dark, light){
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,64,64);
  for (let i=0;i<2200;i++){ g.fillStyle = Math.random()<.5 ? dark : light; g.globalAlpha = 0.25 + Math.random()*0.4; g.fillRect(Math.random()*64|0, Math.random()*64|0, 1, 1 + (Math.random()*3|0)); }
  g.globalAlpha = 0.35; g.fillStyle = dark; g.fillRect(0, 26, 64, 12);     // dorsal stripe runs along the middle of the UV
  g.globalAlpha = 1; const tx = pixelTex(c); tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(3, 2); return tx;
}

// a "sausage" skin: one continuous tube along a curve whose radius changes along its length (and can be taller than wide)
function tubeSkin(points, radii, segs, rings, tall){
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)), false, 'catmullrom', 0.5);
  const frames = curve.computeFrenetFrames(segs, false);
  const pos = [], uv = [], idx = [];
  for (let i=0;i<=segs;i++){
    const t = i/segs, c = curve.getPointAt(t);
    const ri = t*(radii.length-1), r0 = radii[Math.floor(ri)], r1 = radii[Math.min(radii.length-1, Math.floor(ri)+1)], r = r0 + (r1-r0)*(ri - Math.floor(ri));
    const N = frames.normals[i], B = frames.binormals[i];
    for (let j=0;j<=rings;j++){
      const a = j/rings*Math.PI*2, cx = Math.cos(a)*r, cy = Math.sin(a)*r*(tall||1);
      pos.push(c.x + N.x*cx + B.x*cy, c.y + N.y*cx + B.y*cy, c.z + N.z*cx + B.z*cy); uv.push(t*4, j/rings*2);
    }
  }
  for (let i=0;i<segs;i++) for (let j=0;j<rings;j++){ const a = i*(rings+1)+j, b = a+rings+1; idx.push(a, b, a+1, b, b+1, a+1); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals(); return g;
}
// a shaped skin: like tubeSkin but each section is [width, height, drop, squareness] — flat foreheads, deep jaws, narrow necks
function shapeSkin(points, secs, segs, rings){
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)), false, 'catmullrom', 0.5);
  const pos = [], uv = [], idx = [], S = new THREE.Vector3(1, 0, 0), U = new THREE.Vector3();
  for (let i=0;i<=segs;i++){
    const t = i/segs, c = curve.getPointAt(t), T = curve.getTangentAt(t);
    U.crossVectors(S, T).normalize();
    const si = t*(secs.length-1), k = Math.floor(si), f = si - k, a0 = secs[k], a1 = secs[Math.min(secs.length-1, k+1)];
    const lerp = (j, dflt) => { const x0 = a0[j] === undefined ? dflt : a0[j], x1 = a1[j] === undefined ? dflt : a1[j]; return x0 + (x1 - x0)*f; };
    const w = lerp(0, 0.05), h = lerp(1, 0.05), dy = lerp(2, 0), n = lerp(3, 2);
    for (let j=0;j<=rings;j++){
      const a = j/rings*Math.PI*2, ca = Math.cos(a), sa = Math.sin(a);
      const cx = Math.sign(ca)*Math.pow(Math.abs(ca), 2/n)*w, cy = Math.sign(sa)*Math.pow(Math.abs(sa), 2/n)*h + dy;
      pos.push(c.x + S.x*cx + U.x*cy, c.y + S.y*cx + U.y*cy, c.z + S.z*cx + U.z*cy); uv.push(t*4, j/rings*2);
    }
  }
  for (let i=0;i<segs;i++) for (let j=0;j<rings;j++){ const a = i*(rings+1)+j, b = a+rings+1; idx.push(a, b, a+1, b, b+1, a+1); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals(); return g;
}

// streaks of rain in a box around the camera; the box rides with you so it works both driving and walking
const RAIN_N = 1400, rainPos = new Float32Array(RAIN_N*6), rainVel = new Float32Array(RAIN_N);
function seedDrop(i, top){ let x = (Math.random()-0.5)*28; if (Math.abs(x) < 1.7) x += Math.sign(x||1)*1.9;   // keep the column over the car clear so nothing falls through the roof
  const y = top ? 12 + Math.random()*3 : Math.random()*15, z = -26 + Math.random()*36; const len = 0.35 + Math.random()*0.45; rainVel[i] = 9 + Math.random()*4; rainPos.set([x, y, z, x, y - len, z + 0.05], i*6); }
for (let i=0;i<RAIN_N;i++) seedDrop(i, false);
const rainGeo = new THREE.BufferGeometry(); rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rainMat = new THREE.LineBasicMaterial({color:0x9aa4b4, transparent:true, opacity:0, fog:true});
const rain = new THREE.LineSegments(rainGeo, rainMat); rain.frustumCulled = false; scene.add(rain);
let raining = false, rainLevel = 0;
function rainStep(dt){
  rainLevel += ((raining ? 1 : 0) - rainLevel) * Math.min(1, dt*0.08);
  rainMat.opacity = rainLevel*0.55; rain.visible = rainLevel > 0.01; if (!rain.visible) return;
  rainGeo.setDrawRange(0, Math.floor(rainLevel*RAIN_N)*2);
  const drift = speed*dt;                                   // the world slides past the car, so the rain does too
  for (let i=0;i<RAIN_N;i++){
    const o = i*6, fall = rainVel[i]*dt;
    rainPos[o+1] -= fall; rainPos[o+4] -= fall; rainPos[o+2] += drift; rainPos[o+5] += drift;
    if (rainPos[o+1] < -0.5) seedDrop(i, true);
    else if (rainPos[o+2] > 10){ rainPos[o+2] -= 36; rainPos[o+5] -= 36; }
  }
  rainGeo.attributes.position.needsUpdate = true;
  rain.position.set(mode === 'walk' ? camera.position.x : 0, 0, mode === 'walk' ? camera.position.z : 0);
}

function pillTex(name, sub, band){
  const c = document.createElement('canvas'); c.width = 64; c.height = 32; const g = c.getContext('2d');
  g.fillStyle = '#f1ead8'; g.fillRect(0,0,64,32); g.fillStyle = band || '#c8402e'; g.fillRect(0,0,64,6);
  g.fillStyle = '#222'; g.font = 'bold 7px sans-serif'; g.textAlign = 'center'; g.fillText(name || 'IBUPROFEN', 32, 15); g.font = '4px sans-serif'; g.fillText(sub || '200 mg · 100 TABLETS', 32, 22);
  for (let i=0;i<4;i++){ g.fillStyle = '#555'; g.fillRect(6 + i*14, 26, 10, 1); }
  return pixelTex(c);
}
function photoTex(){
  const c = document.createElement('canvas'); c.width = 64; c.height = 48; const g = c.getContext('2d');
  g.fillStyle = '#e9e2d0'; g.fillRect(0,0,64,48);                      // white border
  g.fillStyle = '#b9ab8e'; g.fillRect(4,4,56,36);                      // faded image area
  g.fillStyle = '#a4967a'; g.fillRect(4,24,56,16);                     // ground
  g.fillStyle = '#c8bca0'; g.beginPath(); g.arc(22,20,5,0,7); g.fill(); g.fillRect(18,25,8,13); // a figure, washed out
  g.fillStyle = '#c3b79b'; g.beginPath(); g.arc(38,21,4,0,7); g.fill(); g.fillRect(35,25,6,13); // another
  g.fillStyle = 'rgba(233,226,208,0.55)'; g.fillRect(4,4,56,36);       // fade over everything
  for (let i=0;i<120;i++){ g.fillStyle = 'rgba(120,100,70,0.25)'; g.fillRect(Math.random()*64|0, Math.random()*48|0, 1, 1); } // age spots
  g.fillStyle = 'rgba(90,70,40,0.5)'; g.fillRect(0,40,64,1);
  return pixelTex(c);
}

function profile(points, width, mat, bevel){ // extrude a side-view (z,y) outline across the car's width
  const sh = new THREE.Shape(); points.forEach(([z,y], i) => i ? sh.lineTo(z, y) : sh.moveTo(z, y));
  const g = new THREE.ExtrudeGeometry(sh, {depth: width, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2, curveSegments: 4});
  g.rotateY(-Math.PI/2); g.translate(width/2, 0, 0);     // shape z → world z, extrude → world x, centered
  const m = new THREE.Mesh(g, mat); ext.add(m); return m;
}

// ───────────────────────── GAME CLOCK ─────────────────────────
let clockMin = 23*60+47, clockStr = '';
function updateClock(){
  const h = Math.floor(clockMin/60)%24, m = clockMin%60;
  const h12 = ((h+11)%12)+1; clockStr = h12 + ':' + (m<10?'0':'') + m;
  drawClock(clockStr); document.getElementById('clk').textContent = clockStr + (h>=12 ? ' PM' : ' AM') + '  ·  somewhere off US-82';
}
updateClock();

// ───────────────────────── MAIN LOOP ─────────────────────────
let last = performance.now(), clockAcc = 0, flickerT = 20, flickerLeft = 0, fogBase = 0.046;
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  // approach: ease off the gas, drift right into the lot, and stop beside the pump
  if (mode === 'drive' && stopAt === null){
    speed = Math.min(SPEED, speed + 2.2*dt);                              // ease back up to cruising
    lane += (LANE - lane) * Math.min(1, dt*0.35);                         // drift back into the right lane
  } else if (mode === 'drive'){
    const rem = stopAt - t;
    const target = Math.max(0, Math.min(SPEED, Math.sqrt(Math.max(0, 2*1.6*rem))));
    speed = Math.min(target, speed + 2.2*dt);                             // never faster than the stopping curve, and accelerate gently
    if (stopKind === 'station' || stopKind === 'peanut' || stopKind === 'motel'){ const px = stopKind === 'station' ? PUMP_X : stopKind === 'motel' ? MOTEL_X : PEANUT_X; const k = THREE.MathUtils.smoothstep(THREE.MathUtils.clamp((34 - rem)/26, 0, 1), 0, 1); lane = LANE + (-px - LANE)*k; }
    else lane += (LANE - lane) * Math.min(1, dt*0.35);
    if (stopKind === 'deer' && rem < 42 && !bedDeerFade){ bedDeerFade = true; playBed('none', 14); }
    if (stopKind === 'motel' && rem < 42 && !bedMotel){ bedMotel = true; playBed('atmo3', 10); }           // and something colder creeps in as the motel sign shows through the rain   // the score drains away as the deer comes into the headlights
    if (rem < 0.3){ speed = 0; mode = 'parked'; toast(stopKind === 'deer' ? 'something\u2019s in the road — tap the door handle to get out' : 'tap the door handle to get out'); }
  } else speed = 0;
  t += speed*dt;
  if (engineGain){ engineGain.gain.value = 0.03 + 0.04*(speed/SPEED); windGain.gain.value = 0.045*(speed/SPEED); }
  clockAcc += dt; if (clockAcc > 24){ clockAcc = 0; clockMin++; updateClock(); }

  for (const th of things) place(th);
  for (const group of inst){
    for (let i=0;i<group.data.length;i++){
      const td = group.data[i], r = relOf(td.d);
      dummy.position.set(td.x + C(t+r) - C(t) - r*Cp(t) + lane, 0, -r);
      dummy.scale.set(td.s, td.s, td.s); dummy.rotation.set(td.tilt, td.r, 0);
      dummy.updateMatrix();
      for (const m of group.meshes) m.setMatrixAt(i, dummy.matrix);
    }
    for (const m of group.meshes) m.instanceMatrix.needsUpdate = true;
  }

  // steering & dash
  const steer = Cp(t) + (mode === 'drive' ? (lane - LANE)*-0.03 : 0);
  wheel.rotation.z = -steer*2.8;
  const mph = (speed/SPEED)*(38 + Math.sin(t*0.05)*2.5 + Math.sin(t*0.37)*0.4);
  speedo.pivot.rotation.z = THREE.MathUtils.degToRad(135 - (mph/120)*270);
  tacho.pivot.rotation.z  = THREE.MathUtils.degToRad(135 - ((1.9 + mph/60)/8)*270 + Math.sin(t*3)*1.5);
  fuel.pivot.rotation.z   = THREE.MathUtils.degToRad(135 - fuelLevel*270);

  // dusk → night: after the first stop the blue drains out of the sky over about a minute
  dusk += ((leg >= 1 ? 0 : 1) - dusk) * Math.min(1, dt*0.025);
  skyMat.uniforms.top.value.copy(NIGHT_TOP).lerp(DUSK_TOP, dusk); skyMat.uniforms.hor.value.copy(NIGHT_HOR).lerp(DUSK_HOR, dusk);
  scene.fog.color.copy(NIGHT_FOG).lerp(DUSK_FOG, dusk); scene.background.copy(scene.fog.color);
  hemi.intensity = 0.3 + dusk*0.25; hemi.color.setRGB(0.1 + dusk*0.08, 0.09 + dusk*0.12, 0.19 + dusk*0.25);
  stars.material.opacity = 0.25 + (1 - dusk)*0.75;

  // fog that breathes: a slow swell layered with a faster drift, plus the odd dense bank
  fogBase += (((leg >= 2 ? 0.082 : leg === 1 ? 0.055 : 0.046) + rainLevel*0.012) - fogBase) * Math.min(1, dt*0.03);   // thickens slowly over the first minute of leg two
  const breath = Math.sin(t*0.012) * 0.5 + Math.sin(t*0.031 + 1.7) * 0.3 + Math.sin(t*0.0047 + 4.0) * 0.4;   // -1.2..1.2
  const bank = Math.max(0, Math.sin(t*0.0063 + 2.5) - 0.86) * 7;                                         // rare: a thick wall of fog
  scene.fog.density = fogBase * (1 + breath*0.35 + bank);

  // headlight flicker: rare stutters, more likely when the car jolts
  flickerT -= dt;
  if (flickerT <= 0){ flickerT = 14 + Math.random()*40; flickerLeft = 3 + (Math.random()*7|0); }
  let hl = 1;
  if (flickerLeft > 0 && Math.random() < 0.28){ hl = 0.15 + Math.random()*0.5; flickerLeft--; }
  if (Math.random() < 0.004) hl *= 0.6;                                                                  // lone single-frame dip
  const sway = 1 + Math.sin(t*2.7)*0.015;
  headL.intensity = HEAD_I * hl * sway; headR.intensity = HEAD_I * (hl < 1 ? 0.6 + hl*0.4 : 1) * sway;   // the right one is a bit healthier

  // glovebox door swings down on its hinge
  gloveAngle += ((gloveOpen ? 1.45 : 0) - gloveAngle) * Math.min(1, dt*6);
  gloveHinge.rotation.x = gloveAngle;
  if (!gloveOpen && gloveAngle < 0.05){ pills.visible = sd.visible = false; }

  // tuning: a louder squeal of static right after you turn the dial
  if (tuneBurst > 0){ tuneBurst = Math.max(0, tuneBurst - dt); if (radioGain && stereoOn && STATIONS[station].type === 'static'){ radioGain.gain.value = 0.05 + tuneBurst*0.25; radioFilter.frequency.value = 1800*Math.pow(2, (STATIONS[station].tone||0) + tuneBurst*3); } }

  // store fluorescents: dim, humming, and now and then one stutters
  for (const f of fixtures){
    f.t -= dt;
    if (f.t <= 0){ f.t = 6 + Math.random()*22; f.flick = 0.5 + Math.random()*1.2; }
    let k = 1;
    if (f.flick > 0){ f.flick -= dt; k = Math.random() < 0.45 ? 0.15 + Math.random()*0.5 : 1; }
    f.li.intensity = f.base * k; f.tube.material.color.setRGB(0.18 + 0.44*k, 0.22 + 0.5*k, 0.2 + 0.46*k);
  }

  if (stopKind === 'motel'){
    if (door103Hinge){ door103Angle += ((door103Open ? -1.45 : 0) - door103Angle) * Math.min(1, dt*5); door103Hinge.rotation.y = door103Angle; }
    if (pushT > 0){ // shoved backwards, off the step
      pushT -= dt; const k = Math.max(0, pushT); const sin = Math.sin(yaw), cos = Math.cos(yaw);
      walker.x -= (-sin)*4*dt*k*2; walker.z -= (-cos)*4*dt*k*2; pitch += (0.25 - pitch)*Math.min(1, dt*8)*k*2;
      camera.position.set(walker.x, 1.6 - k*0.25, walker.z); camera.rotation.set(pitch, yaw + (Math.random()-0.5)*0.05*k, (Math.random()-0.5)*0.08*k);
    }
    if (door103Open && !inDialog){ const pl = guest.worldToLocal(new THREE.Vector3(walker.x, 1.6, walker.z)); headG.rotation.y += (Math.max(-0.8, Math.min(0.8, Math.atan2(-pl.x, -pl.z))) - headG.rotation.y) * Math.min(1, dt*2); }
    if (mode === 'walk'){ const pl = clerk.worldToLocal(new THREE.Vector3(walker.x, 1.6, walker.z)); const want = Math.max(-0.8, Math.min(0.8, Math.atan2(-pl.x, -pl.z))); headC.rotation.y += (want - headC.rotation.y) * Math.min(1, dt*1.2); }
    headC.position.y = 1.84 + Math.sin(now*0.002)*0.005;
    for (const r of roomLights){ if (!r.lit) continue; r.t -= dt; if (r.t <= 0){ r.t = 4 + Math.random()*12; r.f = 0.4 + Math.random()*0.8; } let k = 1; if (r.f > 0){ r.f -= dt; k = Math.random() < 0.4 ? 0.2 : 1; } r.li.intensity = 0.5*k; r.lens.material.color.setRGB(0.25 + 0.75*k, 0.2 + 0.6*k, 0.15 + 0.4*k); }
    tvMat.color.setRGB(0.2 + Math.random()*0.15, 0.25 + Math.random()*0.15, 0.4 + Math.random()*0.15);
    signLight.intensity = 1.1 * (Math.random() < 0.06 ? 0.3 : 1);
    vendHum -= dt; if (vendHum <= 0) vendHum = 0.05 + Math.random()*0.3; const vk = Math.random() < 0.08 ? 0.55 : (0.92 + Math.random()*0.08); vendFace.color.setScalar(vk); vendLight.intensity = 0.55*vk;
  }
  if (stopKind === 'peanut' && (mode === 'walk' || mode === 'parked')){
    const pl = woman.worldToLocal(mode === 'walk' ? new THREE.Vector3(walker.x, 1.6, walker.z) : new THREE.Vector3(0, 1.3, 0));
    const want = Math.max(-0.9, Math.min(0.9, Math.atan2(-pl.x, -pl.z)));
    headW.rotation.y += (want - headW.rotation.y) * Math.min(1, dt*1.4); headW.position.y = 1.78 + Math.sin(now*0.0025)*0.005;
  }
  // attendant idle: breathing, a slow turn to follow you when you're near
  if (mode === 'walk' || mode === 'parked'){
    torso.scale.y = 1 + Math.sin(now*0.0022)*0.012; head.position.y = 1.85 + Math.sin(now*0.0022)*0.006;
    const pl = attendant.worldToLocal(mode === 'walk' ? new THREE.Vector3(walker.x, 1.6, walker.z) : new THREE.Vector3(0, 1.3, 0));
    const want = Math.atan2(-pl.x, -pl.z);                                // local -z is forward
    const lim = Math.max(-0.9, Math.min(0.9, want));
    head.rotation.y += (lim - head.rotation.y) * Math.min(1, dt*1.2);
    attendant.rotation.y += (lim*0.5 - attendant.rotation.y) * Math.min(1, dt*0.4);
  }

  if (holdingNozzle && mode === 'walk') updateLiveHose(handNozzle, null);

  const wasDoor = doorSwing > 0, wasBath = bathSwing > 0;
  doorSwing = Math.max(0, doorSwing - dt); bathSwing = Math.max(0, bathSwing - dt);
  if (wasDoor && doorSwing === 0) setTimeout(()=> sfx('door', 0.55), 380); if (wasBath && bathSwing === 0) setTimeout(()=> sfx('door', 0.5), 380);   // the door swings shut behind you and latches
  bathAngle += ((bathSwing > 0 ? 1.5 : 0) - bathAngle) * Math.min(1, dt*4); bathDoorHinge.rotation.y = bathAngle;
  doorAngle += (((doorSwing > 0 && stopKind === 'station') ? -1.6 : 0) - doorAngle) * Math.min(1, dt*4); doorHinge.rotation.y = doorAngle;
  pdoorAngle += (((doorSwing > 0 && stopKind === 'peanut') ? 1.7 : 0) - pdoorAngle) * Math.min(1, dt*4); pdoorHinge.rotation.y = pdoorAngle;

  // fueling: wheels roll, tank fills, then the handle clicks off
  if (fueling){
    fuelT += dt; const gal = Math.min(11.3, fuelT*(11.3/15)); const hn = liveHose.userData.hn;
    if (hn) for (const d of hn.pump.userData.displays) drawPumpDisplay(d.c, d.tex, gal, gal*1.09);
    fuelLevel = 0.12 + (gal/11.3)*0.84;
    if (gal >= 11.3){ fueling = false; fueled = true; stopPumpHum(); click(0.9, 420); setTimeout(()=> click(0.7, 300), 90); thought('It\u2019s done pumping.'); setTimeout(()=> toast('hang the nozzle up, then get back in the car'), 2500); }
  }

  // rain & wipers
  rainStep(dt);
  if (rainLevel > 0.05 && mode !== 'walk'){
    const prev = wiperPhase; wiperPhase += dt*2.4;
    const sw = Math.sin(wiperPhase);                                       // -1..1 sweep
    for (const pv of wiperPivots) pv.rotation.z = -0.55 + (sw*0.5 + 0.5)*1.1;
    if (Math.floor(prev/Math.PI) !== Math.floor(wiperPhase/Math.PI)) click(0.12, 90);   // soft thump at each end of the stroke
  }
  { const outside = mode === 'walk', loaded = rainOut && rainCar;
    if (rainGain) rainGain.gain.value = loaded ? 0 : rainLevel * (outside ? 0.11 : 0.05);                                   // synth hiss only until the real beds are in
    if (loaded && ac){ rainOut.gain.setTargetAtTime(rainLevel * (outside ? 0.7 : 0), ac.currentTime, 0.35); rainCar.gain.setTargetAtTime(rainLevel * (outside ? 0 : 0.7), ac.currentTime, 0.35); }
    if (radioGain && outside !== radioOutside){ radioOutside = outside; radioGain.gain.setTargetAtTime(outside ? 0 : radioWant, ac.currentTime, 0.15); if (radioEl){ if (outside) radioEl.pause(); else if (stereoOn) radioEl.play().catch(()=>{}); } }   // the stereo stays in the car
  }

  // fuel door flap
  fuelAngle += ((fuelOpen ? -1.5 : 0) - fuelAngle) * Math.min(1, dt*8); fuelHinge.rotation.z = fuelAngle;

  // visors swing down from the header
  for (const vs of visors){ vs.angle += ((vs.open ? 1.35 : -0.25) - vs.angle) * Math.min(1, dt*7); vs.h.rotation.x = vs.angle; }

  // console lid tips up on its rear hinge
  consoleAngle += ((consoleOpen ? 1.7 : 0) - consoleAngle) * Math.min(1, dt*6);
  consoleHinge.rotation.x = consoleAngle;
  if (!consoleOpen && consoleAngle < 0.05) consoleItems.visible = false;

  // cigarette lighter: pushed in → heats → pops out glowing → cools
  if (lighterState === 'in'){ lighterTimer -= dt; if (lighterTimer <= 0){ lighterState = 'hot'; lighterHeat = 1; lighterTimer = 9; click(0.6, 900); toast('*pop*'); } }
  else if (lighterState === 'hot'){ lighterTimer -= dt; lighterHeat = Math.max(0, lighterTimer/9); if (lighterTimer <= 0){ lighterState = 'out'; lighterHeat = 0; } }
  lighterDepth += ((lighterState === 'in' ? -0.03 : (lighterState === 'hot' ? 0.012 : 0)) - lighterDepth) * Math.min(1, dt*12);
  lighter.position.z = -0.72 + lighterDepth;
  lighterCoilMat.color.setRGB(0.16 + lighterHeat*0.9, 0.12 + lighterHeat*0.3, 0.12 + lighterHeat*0.02);
  lighterLight.intensity = lighterHeat * 0.9;

  // dangling things swing with the road
  const dangle = Math.sin(t*1.3)*0.08*(speed/SPEED) - steer*0.5 + Math.sin(now*0.0027)*0.03;
  keyring.rotation.z = dangle*0.8;

  // dome light fade + faint old-bulb flicker
  domeLevel += ((domeOn ? 1 : 0) - domeLevel) * Math.min(1, dt*9);
  const flicker = 1 - (Math.random() < 0.03 ? Math.random()*0.35 : 0);
  domeLight.intensity = domeLevel * 1.8 * flicker;
  domeLensMat.color.setRGB(0.23 + domeLevel*0.77, 0.21 + domeLevel*0.5, 0.15 + domeLevel*0.15);
  domeSwitch.rotation.x = domeOn ? 0.5 : -0.5;

  // subtle car bob / lean
  const sf = speed/SPEED;
  const bob = (Math.sin(t*0.9)*0.004 + Math.sin(t*2.7)*0.0015)*sf;
  if (mode === 'walk'){ if (inDialog){ // turn to face him while talking
      (stopKind === 'peanut' ? woman : stopKind === 'motel' ? (door103Open ? guest : clerk) : attendant).getWorldPosition(_v1); const dx = _v1.x - walker.x, dz = _v1.z - walker.z; const wantYaw = Math.atan2(-dx, -dz); let dy = wantYaw - yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); yaw += dy*Math.min(1, dt*3); pitch += (-0.02 - pitch)*Math.min(1, dt*3); camera.rotation.set(pitch, yaw, 0);
    } else walkStep(dt); }
  else {
    cab.rotation.z = (Math.sin(t*0.6)*0.004 - steer*0.06)*sf; cab.rotation.x = bob;
    camera.position.set(-0.56, 1.34, 0.18); camera.rotation.set(pitch + bob, yaw, cab.rotation.z);
  }

  renderer.setRenderTarget(rt); renderer.render(scene, mirrorCam);
  renderer.setRenderTarget(rt2); renderer.render(scene, sideCam);
  renderer.setRenderTarget(null); renderer.render(scene, camera);
  noise();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
